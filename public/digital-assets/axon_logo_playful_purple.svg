<svg width="100%" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#AFA9EC"/>
      <stop offset="100%" stop-color="#7F77DD"/>
    </linearGradient>
    <linearGradient id="pg2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#534AB7"/>
      <stop offset="100%" stop-color="#AFA9EC"/>
    </linearGradient>
